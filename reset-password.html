<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
<title>Set your password — Leave Manager</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-row">
      <h2 style="margin:0;">Set a new password</h2>
      <div class="small">You must choose your own password before continuing.</div>
    </div>
    <div id="msg"></div>
    <form id="form">
      <label>Current (temporary) password</label>
      <input type="password" id="pwCurrent" required autocomplete="current-password">
      <label>New password (min. 12 characters)</label>
      <input type="password" id="pw1" required minlength="12" autocomplete="new-password">
      <label>Confirm new password</label>
      <input type="password" id="pw2" required minlength="12" autocomplete="new-password">
      <div style="margin-top:18px;">
        <button type="submit" class="primary" style="width:100%;" id="btn">Save password</button>
      </div>
    </form>
  </div>
</div>
<script src="shared.js"></script>
<script>
(async () => {
  const session = await getSession();
  if (!session) window.location.href = "login.html";
})();

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const pwCurrent = document.getElementById("pwCurrent").value;
  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;
  if (pw1 !== pw2) { showMsg(msg, "Passwords do not match.", "error"); return; }

  btn.disabled = true; btn.textContent = "Saving…";
  try {
    // One atomic server-side operation: it re-verifies the current
    // password by actually signing in with it before changing anything,
    // and only marks the password as changed once it genuinely has been
    // — a stolen session token alone can't be used to hijack the account
    // through this endpoint.
    await callEdgeFunction("reset-initial-password", { current_password: pwCurrent, new_password: pw1 });
    window.location.href = "calendar.html";
  } catch (err) {
    showMsg(msg, err.message || "Could not save password.", "error");
    btn.disabled = false; btn.textContent = "Save password";
  }
});
</script>
</body>
</html>
