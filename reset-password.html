<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set your password — Leave Manager</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-row">
      <h2 style="margin:0;">Set a new password</h2>
      <div class="small">You must choose your own password before continuing.</div>
    </div>
    <div id="msg"></div>
    <form id="form">
      <label>New password (min. 8 characters)</label>
      <input type="password" id="pw1" required minlength="8">
      <label>Confirm new password</label>
      <input type="password" id="pw2" required minlength="8">
      <div style="margin-top:18px;">
        <button type="submit" class="primary" style="width:100%;" id="btn">Save password</button>
      </div>
    </form>
  </div>
</div>
<script src="shared.js"></script>
<script>
(async () => {
  const session = await getSession();
  if (!session) window.location.href = "login.html";
})();

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;
  if (pw1 !== pw2) { showMsg(msg, "Passwords do not match.", "error"); return; }

  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) throw error;
    const { error: rpcErr } = await sb.rpc("clear_must_reset_flag");
    if (rpcErr) throw rpcErr;
    window.location.href = "calendar.html";
  } catch (err) {
    showMsg(msg, err.message || "Could not save password.", "error");
    btn.disabled = false; btn.textContent = "Save password";
  }
});
</script>
</body>
</html>
