<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
<title>Sign in — Pharmacy Portal</title>
<script>
// Applies the last-known colour theme/mode (cached by applyTheme()/
// applyColorMode() in shared.js) before first paint, so a user who
// picked Dark or Inverted — or a non-default accent theme — doesn't
// see a flash of the default-look page while their profile loads. The
// profile itself (fetched in requireAuth()) remains the source of
// truth and corrects this on every page load.
(function(){try{var m=localStorage.getItem('lm_color_mode'),t=localStorage.getItem('lm_theme');if(m)document.documentElement.setAttribute('data-color-mode',m);if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}

  /* ---- ED&G lockup (bottom-right) — fixed brand identity, stays the
     same regardless of which accent theme is active. ---- */
  .edg-brand{position:fixed;right:40px;bottom:28px;z-index:6;text-align:right;pointer-events:none;animation:edgFadeUp .6s .5s ease both;}
  .edg-brand .mark{font-size:30px;font-weight:800;color:#1a2744;line-height:1;}
  .edg-brand .mark .amp{color:#12a0ad;}
  .edg-brand .mark .tm{font-size:12px;font-weight:700;vertical-align:super;margin-left:1px;}
  .edg-brand .name{margin-top:3px;font-size:12.5px;font-weight:700;color:#1a2744;}
  .edg-brand .rule{height:3px;margin-top:7px;border-radius:2px;overflow:hidden;display:flex;}
  .edg-brand .rule span{flex:1;}
  .edg-brand .rule span:nth-child(1){background:#1a2744;}
  .edg-brand .rule span:nth-child(2){background:#12a0ad;}
  .edg-brand .rule span:nth-child(3){background:#4caf50;}
  @media (max-width:520px){.edg-brand{right:20px;bottom:18px;}.edg-brand .mark{font-size:24px;}}

  /* ---- Hero band with drifting triangles — the app's decorative
     login backdrop. Unlike the ED&G mark above, these ARE driven by
     the active accent theme (--navy/--navy-light/--teal/--teal-light/
     --honey/--honey-dark, all defined in shared.css and overridden per
     data-theme), so picking Forest, Halloween, Christmas etc. still
     recolours the login screen rather than freezing it to one look. ---- */
  .hero-band{background:linear-gradient(160deg,var(--grey-bg) 0%,var(--surface) 45%,var(--surface-alt) 100%);position:relative;overflow:hidden;padding:40px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}
  :root[data-color-mode="dark"] .hero-band,
  :root[data-color-mode="inverted"] .hero-band{background:var(--grey-bg);}
  :root[data-color-mode="dark"] .hero-band .tri,
  :root[data-color-mode="dark"] .hero-band .orb,
  :root[data-color-mode="dark"] .hero-band .particle,
  :root[data-color-mode="dark"] .hero-band .light-beam,
  :root[data-color-mode="inverted"] .hero-band .tri,
  :root[data-color-mode="inverted"] .hero-band .orb,
  :root[data-color-mode="inverted"] .hero-band .particle,
  :root[data-color-mode="inverted"] .hero-band .light-beam{display:none;}

  @keyframes triRight{
    0%  {transform:translateX(-120vw) scaleY(1)    scaleX(1);   clip-path:polygon(5% 100%,95% 100%,18% 0%);}
    25% {transform:translateX(-60vw)  scaleY(1.3)  scaleX(1.15);clip-path:polygon(3% 100%,92% 100%,32% 0%);}
    50% {transform:translateX(0vw)    scaleY(0.82) scaleX(0.9); clip-path:polygon(7% 100%,97% 100%,22% 0%);}
    75% {transform:translateX(60vw)   scaleY(1.2)  scaleX(1.2); clip-path:polygon(2% 100%,90% 100%,38% 0%);}
    100%{transform:translateX(120vw)  scaleY(1)    scaleX(1);   clip-path:polygon(5% 100%,95% 100%,18% 0%);}
  }
  @keyframes triLeft{
    0%  {transform:translateX(120vw)  scaleY(1)    scaleX(1);   clip-path:polygon(95% 100%,5% 100%,62% 0%);}
    25% {transform:translateX(60vw)   scaleY(0.8)  scaleX(1.25);clip-path:polygon(97% 100%,3% 100%,44% 0%);}
    50% {transform:translateX(0vw)    scaleY(1.35) scaleX(0.82);clip-path:polygon(92% 100%,8% 100%,70% 0%);}
    75% {transform:translateX(-60vw)  scaleY(0.9)  scaleX(1.1); clip-path:polygon(98% 100%,4% 100%,55% 0%);}
    100%{transform:translateX(-120vw) scaleY(1)    scaleX(1);   clip-path:polygon(95% 100%,5% 100%,62% 0%);}
  }
  .tri{position:absolute;bottom:-1px;}
  .tri-a{left:-5%;width:50%;height:165px;background:var(--navy-light);opacity:0.5;transform-origin:bottom left;animation:triRight 180s linear infinite;animation-delay:0s;}
  .tri-b{left:-5%;width:50%;height:125px;background:var(--teal-light);opacity:0.55;transform-origin:bottom left;animation:triRight 180s linear infinite;animation-delay:-90s;}
  .tri-c{right:-5%;width:48%;height:145px;background:var(--teal);opacity:0.45;transform-origin:bottom right;animation:triLeft 216s linear infinite;animation-delay:0s;}
  .tri-d{right:-5%;width:36%;height:105px;background:var(--honey);opacity:0.4;transform-origin:bottom right;animation:triLeft 216s linear infinite;animation-delay:-108s;}
  .tri-e{left:-5%;width:44%;height:150px;background:var(--navy);opacity:0.35;transform-origin:bottom left;animation:triRight 180s linear infinite;animation-delay:-60s;}
  .tri-f{right:-5%;width:32%;height:118px;background:var(--honey-dark);opacity:0.4;transform-origin:bottom right;animation:triLeft 216s linear infinite;animation-delay:-72s;}

  /* ---- Glowing orbs — subtle ambient colour, not theme-bound (kept
     as blue/green rgba so they stay a soft glow under any theme rather
     than needing an rgba variant of every theme colour). ---- */
  .orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;opacity:0;animation:orbPulse var(--dur) ease-in-out infinite var(--delay);z-index:1;}
  .orb1{width:320px;height:320px;background:rgba(95,182,224,0.30);top:10%;left:15%;--dur:7s;--delay:0s;}
  .orb2{width:260px;height:260px;background:rgba(76,175,80,0.20);top:30%;right:10%;--dur:9s;--delay:2s;}
  .orb3{width:200px;height:200px;background:rgba(18,160,173,0.18);bottom:20%;left:40%;--dur:11s;--delay:4s;}
  .orb4{width:180px;height:180px;background:rgba(159,208,238,0.35);bottom:30%;right:25%;--dur:8s;--delay:1s;}
  @keyframes orbPulse{0%{opacity:0;transform:scale(0.9);}40%{opacity:1;transform:scale(1.08);}70%{opacity:0.6;transform:scale(0.95);}100%{opacity:0;transform:scale(0.9);}}

  /* ---- Floating particles ---- */
  .particle{position:absolute;border-radius:50%;pointer-events:none;z-index:1;}
  @keyframes floatUp1{0%{transform:translateY(0) translateX(0);opacity:0;}10%{opacity:1;}90%{opacity:0.6;}100%{transform:translateY(-100vh) translateX(20px);opacity:0;}}
  @keyframes floatUp2{0%{transform:translateY(0) translateX(0);opacity:0;}10%{opacity:0.7;}90%{opacity:0.3;}100%{transform:translateY(-100vh) translateX(-30px);opacity:0;}}
  @keyframes floatUp3{0%{transform:translateY(0) translateX(0);opacity:0;}15%{opacity:0.9;}85%{opacity:0.4;}100%{transform:translateY(-100vh) translateX(15px);opacity:0;}}
  @keyframes bobble{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}

  /* ---- Light beams ---- */
  .light-beam{position:absolute;top:-20%;width:2px;pointer-events:none;z-index:1;border-radius:2px;}
  @keyframes beamFall{0%{transform:translateY(-10%) scaleX(1);opacity:0;}15%{opacity:1;}85%{opacity:0.6;}100%{transform:translateY(120vh) scaleX(1.4);opacity:0;}}

  @keyframes edgFadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  @media (prefers-reduced-motion:reduce){
    .tri,.orb,.particle,.light-beam{animation:none;}
  }

  /* ---- Login card ---- */
  .login-wrap{position:relative;z-index:5;width:100%;max-width:380px;opacity:0;animation:edgFadeUp .6s .3s ease both;}
  .brand-mark{text-align:center;margin-bottom:22px;}
  .brand-mark .name{font-size:24px;font-weight:800;color:var(--heading-color);letter-spacing:0.01em;}
  .brand-mark .sub{font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;margin-top:4px;}

  .login-card{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(6px);
    border:1px solid rgba(26,39,68,.08);
    border-radius:14px;
    border-top:4px solid var(--teal);
    box-shadow:0 20px 50px rgba(26,39,68,.14);
    padding:30px 28px 26px;
  }
  :root[data-color-mode="dark"] .login-card,
  :root[data-color-mode="inverted"] .login-card{
    background:var(--surface);backdrop-filter:none;box-shadow:none;
  }

  .login-card .logo-row h2{color:var(--heading-color);}
  .login-card button.primary{background:var(--navy);}
  .login-card button.primary:hover{background:var(--teal);}
</style>
</head>
<body>

<div class="edg-brand" aria-hidden="true">
  <div class="mark">ED<span class="amp">&amp;</span>G<span class="tm">&trade;</span></div>
  <div class="name">Evolve Digital &amp; Governance</div>
  <div class="rule"><span></span><span></span><span></span></div>
</div>

<div class="hero-band">
  <div class="tri tri-a"></div>
  <div class="tri tri-b"></div>
  <div class="tri tri-c"></div>
  <div class="tri tri-d"></div>
  <div class="tri tri-e"></div>
  <div class="tri tri-f"></div>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>

  <div class="light-beam" style="left:12%;height:60%;background:linear-gradient(to bottom,transparent,rgba(18,160,173,0.10),transparent);width:3px;animation:beamFall 14s linear infinite;animation-delay:0s"></div>
  <div class="light-beam" style="left:34%;height:75%;background:linear-gradient(to bottom,transparent,rgba(95,182,224,0.14),transparent);width:2px;animation:beamFall 18s linear infinite;animation-delay:-5s"></div>
  <div class="light-beam" style="left:62%;height:55%;background:linear-gradient(to bottom,transparent,rgba(76,175,80,0.10),transparent);width:4px;animation:beamFall 22s linear infinite;animation-delay:-9s"></div>
  <div class="light-beam" style="left:84%;height:70%;background:linear-gradient(to bottom,transparent,rgba(76,175,80,0.12),transparent);width:2px;animation:beamFall 16s linear infinite;animation-delay:-3s"></div>

  <div class="particle" style="width:4px;height:4px;background:rgba(95,182,224,0.6);bottom:5%;left:8%;animation:floatUp1 12s linear infinite,bobble 4s ease-in-out infinite;animation-delay:0s,0s"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(76,175,80,0.7);bottom:5%;left:20%;animation:floatUp2 16s linear infinite,bobble 6s ease-in-out infinite;animation-delay:-4s,-1s"></div>
  <div class="particle" style="width:5px;height:5px;background:rgba(18,160,173,0.45);bottom:5%;left:33%;animation:floatUp3 14s linear infinite,bobble 5s ease-in-out infinite;animation-delay:-8s,-2s"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(76,175,80,0.6);bottom:5%;left:45%;animation:floatUp1 18s linear infinite,bobble 7s ease-in-out infinite;animation-delay:-2s,-3s"></div>
  <div class="particle" style="width:4px;height:4px;background:rgba(95,182,224,0.55);bottom:5%;left:57%;animation:floatUp2 13s linear infinite,bobble 4.5s ease-in-out infinite;animation-delay:-6s,-1.5s"></div>
  <div class="particle" style="width:6px;height:6px;background:rgba(18,160,173,0.45);bottom:5%;left:68%;animation:floatUp3 20s linear infinite,bobble 6.5s ease-in-out infinite;animation-delay:-10s,-0.5s"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(159,208,238,0.8);bottom:5%;left:76%;animation:floatUp1 15s linear infinite,bobble 5.5s ease-in-out infinite;animation-delay:-3s,-2.5s"></div>
  <div class="particle" style="width:4px;height:4px;background:rgba(76,175,80,0.55);bottom:5%;left:84%;animation:floatUp2 17s linear infinite,bobble 4s ease-in-out infinite;animation-delay:-7s,-1s"></div>
  <div class="particle" style="width:5px;height:5px;background:rgba(18,160,173,0.5);bottom:5%;left:91%;animation:floatUp3 11s linear infinite,bobble 6s ease-in-out infinite;animation-delay:-1s,-3.5s"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(95,182,224,0.5);bottom:5%;left:4%;animation:floatUp1 19s linear infinite,bobble 5s ease-in-out infinite;animation-delay:-5s,-2s"></div>

  <div class="login-wrap">
    <div class="brand-mark">
      <div class="name">Pharmacy Portal</div>
      <div class="sub">by ED&amp;G&trade;</div>
    </div>

    <div class="login-card">
      <div id="msg"></div>
      <form id="loginForm">
        <label>User ID</label>
        <input type="text" id="userId" autocomplete="username" required>
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <div style="margin-top:18px;">
          <button type="submit" class="primary" style="width:100%;" id="submitBtn">Sign in</button>
        </div>
      </form>
      <p class="small center" style="margin-top:14px;">
        Forgotten your password? Ask a Clinical Team Lead or Developer to reset it from Admin &rarr; Users.
      </p>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get("err") === "inactive") {
  showMsg(document.getElementById("msg"), "Your account is not active. Contact a Clinical Team Lead.", "error");
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");
  const userId = document.getElementById("userId").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  btn.disabled = true; btn.textContent = "Signing in…";
  msg.innerHTML = "";

  try {
    // The email itself is never resolved or returned to the browser —
    // this edge function looks it up and signs in entirely server-side,
    // handing back only session tokens. A nonexistent User ID, an
    // inactive account, and a wrong password all get the identical
    // generic error, so this can't be used to probe which accounts exist.
    const res = await fetch(`${EDGE_FUNCTIONS_URL}/login-with-user-id`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ user_id: userId, password }),
    });
    const result = await res.json();
    if (!res.ok || !result.access_token) {
      throw new Error(result.error || "Sign in failed.");
    }

    const { error } = await sb.auth.setSession({
      access_token: result.access_token,
      refresh_token: result.refresh_token,
    });
    if (error) throw error;

    window.location.href = "portal.html";
  } catch (err) {
    showMsg(msg, "Sign in failed — check your User ID and password.", "error");
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
});

(async () => {
  const session = await getSession();
  if (session) window.location.href = "portal.html";
})();
</script>
</body>
</html>
