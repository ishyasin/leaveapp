<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Leave Manager</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-row">
      <h2 style="margin:0;">Leave Manager</h2>
      <div class="small">GD&amp;G Special Projects&trade;</div>
    </div>
    <div id="msg"></div>
    <form id="loginForm">
      <label>User ID</label>
      <input type="text" id="userId" autocomplete="username" required>
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div style="margin-top:18px;">
        <button type="submit" class="primary" style="width:100%;" id="submitBtn">Sign in</button>
      </div>
    </form>
    <p class="small center" style="margin-top:14px;">
      Forgotten your password? Ask a Clinical Team Lead or Developer to reset it from Admin &rarr; Users.
    </p>
  </div>
</div>
<script src="shared.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get("err") === "inactive") {
  showMsg(document.getElementById("msg"), "Your account is not active. Contact a Clinical Team Lead.", "error");
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");
  const userId = document.getElementById("userId").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  btn.disabled = true; btn.textContent = "Signing in…";
  msg.innerHTML = "";

  try {
    // Resolve User ID -> the real auth email via RPC (avoids exposing emails directly).
    const { data: email, error: lookupErr } = await sb.rpc("email_for_user_id", { p_user_id: userId });
    const loginEmail = email || `${userId}@${LOGIN_EMAIL_DOMAIN}`;
    if (lookupErr) throw lookupErr;

    const { error } = await sb.auth.signInWithPassword({ email: loginEmail, password });
    if (error) throw error;

    window.location.href = "calendar.html";
  } catch (err) {
    showMsg(msg, "Sign in failed — check your User ID and password.", "error");
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
});

(async () => {
  const session = await getSession();
  if (session) window.location.href = "calendar.html";
})();
</script>
</body>
</html>
