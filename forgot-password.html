<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
<title>Forgotten password — Pharmacy Portal</title>
<script>
// Applies the last-known colour theme/mode (cached by applyTheme()/
// applyColorMode() in shared.js) before first paint, so a user who
// picked Dark or Inverted doesn't see a flash of the light page while
// their profile loads. The profile itself (fetched in requireAuth())
// remains the source of truth and corrects this on every page load.
(function(){try{var m=localStorage.getItem('lm_color_mode'),t=localStorage.getItem('lm_theme');if(m)document.documentElement.setAttribute('data-color-mode',m);if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-row">
      <h2 style="margin:0;" id="title">Forgotten your password?</h2>
      <div class="small" id="sub">Enter your User ID and email address and we will send you a link.</div>
    </div>
    <div id="msg"></div>
    <form id="reqForm">
      <label for="uid">User ID</label>
      <input type="text" id="uid" required autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="email">Email address</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@nhs.net">
      <div style="margin-top:18px;"><button type="submit" class="primary" style="width:100%;" id="reqBtn">Send reset link</button></div>
    </form>
    <form id="newForm" hidden>
      <label for="pw1">New password (min. 12 characters)</label>
      <input type="password" id="pw1" required minlength="12" autocomplete="new-password">
      <label for="pw2">Confirm new password</label>
      <input type="password" id="pw2" required minlength="12" autocomplete="new-password">
      <div style="margin-top:18px;"><button type="submit" class="primary" style="width:100%;" id="newBtn">Save password</button></div>
    </form>
    <p class="small center" style="margin-top:14px;"><a href="login.html">&larr; Back to sign in</a></p>
  </div>
</div>
<script src="shared.js"></script>
<script>
const msg = document.getElementById("msg");
const token = new URLSearchParams(window.location.search).get("token");

async function call(payload) {
  const res = await fetch(`${EDGE_FUNCTIONS_URL}/password-reset`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify(payload),
  });
  let out = {};
  try { out = await res.json(); } catch (_) { throw new Error("The service is not responding. Please try again shortly."); }
  if (!res.ok) throw new Error(out.error || "Something went wrong. Please try again.");
  return out;
}

if (token) {
  // link from the email: check it first, then show the new-password form
  document.getElementById("reqForm").hidden = true;
  document.getElementById("title").textContent = "Choose a new password";
  document.getElementById("sub").textContent = "Checking your link…";
  call({ action: "check", token }).then(() => {
    document.getElementById("sub").textContent = "Pick a password you have not used before.";
    document.getElementById("newForm").hidden = false;
    document.getElementById("pw1").focus();
  }).catch((err) => {
    document.getElementById("sub").textContent = "";
    showMsg(msg, err.message, "error");
    document.getElementById("reqForm").hidden = false;
  });
}

document.getElementById("reqForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("reqBtn");
  btn.disabled = true; btn.textContent = "Sending…";
  msg.innerHTML = "";
  try {
    await call({ action: "request", user_id: document.getElementById("uid").value.trim(), email: document.getElementById("email").value.trim() });
    document.getElementById("reqForm").hidden = true;
    showMsg(msg, "If those details match an account, we have emailed a reset link. It works once and expires in 30 minutes. Check your junk folder if it does not arrive. If it still does not, ask a Clinical Team Lead or Developer to reset it for you.", "ok");
  } catch (err) {
    showMsg(msg, err.message, "error");
    btn.disabled = false; btn.textContent = "Send reset link";
  }
});

document.getElementById("newForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("newBtn");
  const pw1 = document.getElementById("pw1").value, pw2 = document.getElementById("pw2").value;
  if (pw1 !== pw2) { showMsg(msg, "Passwords do not match.", "error"); return; }
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    await call({ action: "complete", token, password: pw1 });
    document.getElementById("newForm").hidden = true;
    document.getElementById("sub").textContent = "";
    showMsg(msg, "Your password has been changed. You can now sign in.", "ok");
    setTimeout(() => { window.location.href = "login.html"; }, 2500);
  } catch (err) {
    showMsg(msg, err.message, "error");
    btn.disabled = false; btn.textContent = "Save password";
  }
});
</script>
</body>
</html>
